site_name: GiovaniDev - Desenvolvedor Fullstack
site_url: https://sitename.example

theme:
  name: lux

  font:
    text: Inter
    code: Fira Code

  features:
    - navigation.sections
    - navigation.instant
    - content.code.annotate
    - palette.toggle

plugins:
  - search

extra_css:
  - 'extra.css'

nav:
